<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set data-theme before first paint to avoid a flash of the wrong theme.
			// Mirrors the logic in src/lib/utils/theme.svelte.ts.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						!stored || stored === 'system' || stored === 'undefined'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: stored;
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
		<style>
			body {
				margin: 0;
				padding: 0;
				min-height: 100vh;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-100">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
