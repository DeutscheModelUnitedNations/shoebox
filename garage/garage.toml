# Garage configuration for local development only. Never reuse these secrets.
# Reference: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_secret = "1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.localhost"

# Buckets with website access enabled are served anonymously here, addressed by
# <bucket>.web.localhost. Browsers resolve *.localhost to the loopback address.
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "shoebox-dev-admin-token"
